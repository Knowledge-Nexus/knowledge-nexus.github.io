name = "nexus-ficheiros"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "nexus-ficheiros"

# Contas (docs/configuracao.md, 4.5): a base de dados D1 criada com
#   npx wrangler d1 create nexus-contas
# (o database_id não é segredo). Tabelas: npx wrangler d1 migrations apply nexus-contas --remote
[[d1_databases]]
binding = "DB"
database_name = "nexus-contas"
database_id = "5410656d-00e0-4048-96bb-80daa38405ca"
migrations_dir = "migrations"

[vars]
# Repositórios de dados (privados) autorizados; o primeiro usa o prefixo `blobs/` e é o das contas.
DATA_REPOS = "Knowledge-Nexus/estudo-dados"
ALLOWED_ORIGINS = "https://knowledge-nexus.github.io,http://localhost:5173,http://127.0.0.1:5173"
# Corte duro de espaço (bytes decimais) e tamanho máximo por ficheiro.
MAX_BYTES = "9500000000"
MAX_UPLOAD_BYTES = "99614720"
# Contas: "open" (qualquer pessoa cria conta e fica à espera que lhe dês acesso) ou "invite"
# (só com um convite teu).
SIGNUP = "open"
APP_URL = "https://knowledge-nexus.github.io/"
# Segredos (npx wrangler secret put <NOME>), nunca neste ficheiro:
#   GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY   GitHub App instalada só no repositório de dados
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET  (opcional) «Entrar com Google»
