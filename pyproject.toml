[project]
name = "nexus"
version = "0.1.0"
description = "Motor do depósito da plataforma de estudo Knowledge Nexus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pillow>=10.3",
    "pillow-heif>=0.18",
    "rarfile>=4.2",
    "py7zr>=0.21",
    "charset-normalizer>=3.3",
    "httpx>=0.27",
    "watchdog>=4.0",
    "boto3>=1.34",
]

[project.scripts]
nexus = "nexus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/nexus"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "nexus/_config"

[tool.pytest.ini_options]
testpaths = ["tests/backend", "tests/contrato"]
markers = [
    "ocr: precisa do Tesseract com o pacote por",
    "libreoffice: precisa do LibreOffice (soffice)",
    "pandoc: precisa do Pandoc",
]
filterwarnings = ["ignore::DeprecationWarning:pymupdf.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["nexus"]
mypy_path = "backend"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
