# Vocabulários configuráveis (semente). O `nexus scaffold` copia este ficheiro para
# `catalogo/vocabularios.yaml` no repositório de dados, onde pode ser editado.
#
# Regras:
# - `slug` é um identificador estável (aparece em caminhos e referências). Não o mudes
#   depois de haver documentos classificados; muda antes o rótulo.
# - `labels` são traduzíveis (pt-PT por defeito).
# - `keywords` escrevem-se normalmente (com acentos, em pt-PT); são comparadas depois de
#   normalizadas: minúsculas, sem acentos e com as grafias pré-AO/AO90 unificadas
#   (lectivo = letivo, correcção = correção). Aparecem assim nas justificações.
# - `patterns` são expressões regulares aplicadas ao texto normalizado.
# - `extensions` (só tipos de documento): formatos que por si só são indício do tipo.
# - `producers` (só tipos de documento): programas que criaram o PDF (metadados creator /
#   producer) e que por si só são indício do tipo (ex.: PowerPoint → slides).
# - `excluded_by` (só tipos de documento): palavras que, no nome do ficheiro, afastam o tipo
#   (a pauta do «Teste 1» não é o enunciado do teste).
# - O código nunca depende de um slug concreto; só dos atributos (`is_assessment`,
#   `role`, `is_submission`, `is_syllabus`, `is_fallback`, `extensions`, `producers`,
#   `excluded_by`).
version: 3

# Termos genéricos do ensino que nunca são o nome de uma cadeira (nem de um curso): não
# geram propostas de catálogo. Comparados depois de normalizados.
generic_terms: [unidade curricular, unidades curriculares, disciplina, cadeira, ficha de trabalho,
                fichas de trabalho, ficha de exercícios, questões de aula, questão de aula,
                prático-laboratorial, práticas laboratoriais, teórico-prático, teórico-prática,
                trabalho prático, avaliação, avaliação final, avaliação periódica,
                avaliação contínua, época normal, época de recurso, material de apoio,
                plano de estudos, ano lectivo, semestre, licenciatura, mestrado, doutoramento,
                aula teórica, aula prática, sumários, exame final, frequência, mini-teste]

# Pastas de arrumação que não dizem nada sobre o tipo (exportações do Moodle, do Inforestudante…):
# como as pastas de material, não juntam os ficheiros num conjunto.
neutral_folders: [geral, materiais sem tipo de material definido, outros, outros materiais,
                  diversos, materiais diversos, documentos, ficheiros, material, materiais,
                  recursos, conteúdos]

document_types:
  - slug: slides
    labels: { pt-PT: "Teóricas / slides", en: "Lectures / slides" }
    role: any
    # Formatos que, por si só, são indício deste tipo.
    extensions: [pptx, ppt, pps, ppsx, odp, key]
    producers: [powerpoint, keynote, impress, beamer, google slides]
    keywords: [slides, diapositivos, teórica, teóricas, aula teórica, aulas teóricas,
               apresentação, lecture, lectures, capítulo, chapter, sumário,
               material teórico, aula]
    # "Cap_06" nos nomes dos ficheiros (capítulo 6).
    patterns: ['\bcap \d']
  - slug: apontamentos
    labels: { pt-PT: "Apontamentos", en: "Notes" }
    role: any
    keywords: [apontamentos, resumo, resumos, sebenta, caderno, notes, summary,
               textos de apoio, texto de apoio, notas de aula, lecture notes,
               material de apoio]
  - slug: fichas-exercicios
    labels: { pt-PT: "Fichas de exercícios", en: "Exercise sheets" }
    role: statement
    keywords: &exercise_keywords [ficha, fichas, ficha de exercícios, folha de exercícios,
               folha, folhas, caderno de exercícios, exercícios, exercício, problemas,
               exercises, problem set, aula prática, aulas práticas, prática, práticas,
               prática laboratorial, práticas laboratoriais, tp, tp1, tp2, pl,
               material prático, prático, práticos, ficha de trabalho, fichas de trabalho,
               trabalho para casa, prático-laboratorial]
    # "FT 1", "FT2" (ficha de trabalho) e "TPC3" (trabalho para casa) nos nomes.
    patterns: &exercise_patterns ['\bft ?\d', '\btpc ?\d*\b']
  - slug: resolucoes-exercicios
    labels: { pt-PT: "Resoluções de exercícios", en: "Exercise solutions" }
    role: solution
    keywords: *exercise_keywords
    patterns: *exercise_patterns
  - slug: enunciados-avaliacao
    labels: { pt-PT: "Enunciados de avaliação", en: "Assessment papers" }
    role: statement
    is_assessment: true
    keywords: &assessment_keywords [exame, exames, teste, testes, frequência, mini-teste,
               mini-testes, miniteste, prova, provas, época, exam, test, quiz, midterm,
               duração, cotação, cotações, número de estudante, número de aluno,
               sem consulta, com consulta, questões de aula, questão de aula, prova escrita,
               prova oral, material de avaliação]
    # "fre1", "freq", "resfreq" nos nomes dos ficheiros.
    patterns: &assessment_patterns ['(\b|(?<=res))freq?\b']
    # Pautas, listas e horários falam de testes e exames, mas não são o enunciado.
    excluded_by: &assessment_excluded [pauta, pautas, classificação, classificações, classif,
                                       resultados, notas, horário, horários, alunos,
                                       admitidos, inscritos, calendário]
  - slug: resolucoes-avaliacao
    labels: { pt-PT: "Resoluções de avaliações", en: "Assessment solutions" }
    role: solution
    is_assessment: true
    keywords: *assessment_keywords
    patterns: *assessment_patterns
    excluded_by: *assessment_excluded
  - slug: enunciados-trabalhos
    labels: { pt-PT: "Enunciados de trabalhos / projectos", en: "Assignments / projects" }
    role: statement
    keywords: [trabalho prático, trabalho de grupo, trabalho individual, projecto,
               enunciado do projecto, enunciado do trabalho, guia de laboratório,
               laboratório, assignment, project, mini-projecto]
  - slug: entregas
    labels: { pt-PT: "Entregas (relatórios, código)", en: "Submissions" }
    role: any
    is_submission: true
    keywords: [relatório, entrega, submissão, report, submission, código-fonte]
  - slug: bibliografia
    labels: { pt-PT: "Bibliografia", en: "Bibliography" }
    role: any
    keywords: [livro, book, bibliografia, isbn, edição, edition, publisher, editora, copyright,
               manual, manuais, anotado, código anotado, jurisprudência, acórdão, acórdãos,
               doutrina]
  - slug: formularios
    labels: { pt-PT: "Formulários", en: "Formula sheets" }
    role: any
    keywords: [formulário, formulários, fórmulas, folha de consulta, cheat sheet,
               cheatsheet, tabela de integrais, tabela de derivadas]
  - slug: programa-uc
    labels: { pt-PT: "Ficha da cadeira / programa", en: "Course syllabus" }
    role: any
    is_syllabus: true
    keywords: [ficha da unidade curricular, ficha da UC, programa da unidade curricular,
               programa, conteúdos programáticos, objectivos de aprendizagem,
               métodos de avaliação, bibliografia principal, syllabus, ECTS]
  - slug: informacoes
    labels: { pt-PT: "Informações (pautas, horários, avisos)", en: "Notices (grades, timetables)" }
    role: any
    keywords: [pauta, pautas, classificação, classificações, classif, notas finais, resultados,
               admitidos, em condições de realizar, horário, horários,
               horário de atendimento, atendimento, calendário, calendário de avaliações,
               aviso, avisos, planeamento, regulamento, lista de alunos, grades, timetable]
  - slug: outros
    labels: { pt-PT: "Outros", en: "Other" }
    role: any
    is_fallback: true
    keywords: []

# Papéis de um documento: enunciado ou resolução.
roles:
  - slug: statement
    labels: { pt-PT: "Enunciado", en: "Statement" }
    keywords: [enunciado, enunciados, statement, questions]
  - slug: solution
    labels: { pt-PT: "Resolução", en: "Solution" }
    keywords: [resolução, resoluções, resolvido, resolvida, resolvidos, solução, soluções,
               correcção, proposta de resolução, critérios de correcção, solutions,
               solution, answers, respostas, grelha, grelha de correcção,
               tópicos de correcção, com soluções, com sol, sols]
    # Abreviaturas comuns nos nomes dos ficheiros: res_fre1, corr_teste1, sol_exame,
    # resfreq… (o texto já vem normalizado: minúsculas, sem acentos, "fre1" → "fre 1").
    patterns: ['^(res|resol|corr|sol)\b', '^res(freq?|exame|teste|ficha)',
               '\b(res|resol|corr|sol) (freq?|frequencia|teste|exame|ficha|tp|pl)\b']

# Origem de uma resolução.
solution_origins:
  - slug: oficial
    labels: { pt-PT: "Oficial", en: "Official" }
    keywords: [proposta de resolução, resolução oficial, critérios de correcção, docente,
               grelha de correcção, tópicos de correcção]
  - slug: propria
    labels: { pt-PT: "Própria", en: "Own" }
    keywords: [minha resolução, a minha resolução, resolução própria]
  - slug: colegas
    labels: { pt-PT: "De colegas", en: "From peers" }
    keywords: [resolução de colegas, resolução do colega, feito por alunos]
  - slug: desconhecida
    labels: { pt-PT: "Desconhecida", en: "Unknown" }
    is_fallback: true
    keywords: []

assessment_types:
  - slug: mini-teste
    labels: { pt-PT: "Mini-teste", en: "Quiz" }
    keywords: [mini-teste, mini-testes, miniteste, minitestes, quiz, questão-aula,
               questões de aula, questão de aula]
    # "QA6" (questões de aula 6) nos nomes dos ficheiros.
    patterns: ['\bqa ?\d']
  - slug: teste
    labels: { pt-PT: "Teste", en: "Test" }
    keywords: [teste, testes, test, midterm, teste intercalar]
  - slug: frequencia
    labels: { pt-PT: "Frequência", en: "Midterm (frequência)" }
    keywords: [frequência, frequências]
    patterns: ['(\b|(?<=res))freq?\b']
  - slug: exame
    labels: { pt-PT: "Exame", en: "Exam" }
    keywords: [exame, exames, exam, prova final, prova escrita]
  - slug: trabalho-individual
    labels: { pt-PT: "Trabalho individual", en: "Individual assignment" }
    keywords: [trabalho individual]
  - slug: trabalho-grupo
    labels: { pt-PT: "Trabalho de grupo", en: "Group assignment" }
    keywords: [trabalho de grupo, trabalho em grupo, projecto de grupo]

exam_seasons:
  - slug: normal
    labels: { pt-PT: "Época normal", en: "Regular season" }
    keywords: [época normal, 1.ª época, 1ª época, primeira época, época de avaliação normal]
  - slug: recurso
    labels: { pt-PT: "Época de recurso", en: "Resit" }
    keywords: [época de recurso, recurso, 2.ª época, 2ª época, segunda época, resit]
  - slug: especial
    labels: { pt-PT: "Época especial", en: "Special season" }
    keywords: [época especial, especial]
