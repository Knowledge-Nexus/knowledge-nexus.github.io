# Processa o depósito a cada envio. A lógica vive no workflow reutilizável do repositório
# da aplicação (código público); os dados nunca saem deste repositório privado.
name: nexus

on:
  push:
    branches: [main]
    paths:
      - "deposito/**"
      - "documentos/**"
      - "catalogo/**"
      - "utilizadores/**"
      - "revisao/**"
      - "nexus.yaml"
  workflow_dispatch:
    inputs:
      reclassificar:
        description: "Reclassificar tudo o que não foi revisto por ti"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: nexus-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    # Processamento só no teu computador (`nexus servir`): cria a variável
    # NEXUS_PROCESSAMENTO=local (Settings → Secrets and variables → Actions → Variables).
    # O Actions deixa de correr e não gasta minutos; apaga a variável para voltar.
    if: vars.NEXUS_PROCESSAMENTO != 'local'
    uses: __APP_REPOSITORY__/.github/workflows/pipeline.yml@__APP_REF__
    with:
      app-ref: __APP_REF__
      reclassify: ${{ inputs.reclassificar || false }}
    # Passa os segredos: NEXUS_PUBLICO_TOKEN (material público) e NEXUS_R2_* (originais no R2).
    secrets: inherit
