# Workflow REUTILIZÁVEL: corre no contexto do repositório de dados privado que o chama
# (.github/workflows/nexus.yml gerado por `nexus scaffold`). Os dados nunca saem desse
# repositório; daqui só vem o código do motor.
name: pipeline (reutilizável)

on:
  workflow_call:
    inputs:
      app-ref:
        description: "Ramo/tag deste repositório com a versão do motor a usar"
        type: string
        default: main
      reclassify:
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  processar:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Recusar repositórios públicos
        if: ${{ github.event.repository.private != true }}
        run: |
          echo "::error::O repositório de dados tem de ser PRIVADO (material com direitos de autor)."
          exit 1

      - name: Checkout dos dados (sem descarregar os originais)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/originais/

      - name: Ferramentas necessárias para este lote
        id: tools
        run: |
          set -euo pipefail
          office=false; archives=false; deposit=false
          # Há trabalho no depósito? Sem nada, a execução só reconcilia (ex.: uma correcção
          # feita na interface) e dispensa o OCR e o Pandoc.
          if find deposito -type f ! -name '_LEIA-ME.txt' ! -path '*/_erros/*' 2>/dev/null \
               | grep -q .; then
            deposit=true
          fi
          if find deposito -type f \( -iname '*.doc' -o -iname '*.docx' -o -iname '*.ppt' \
               -o -iname '*.pptx' -o -iname '*.pps' -o -iname '*.xls' -o -iname '*.odt' \
               -o -iname '*.odp' -o -iname '*.ods' -o -iname '*.rtf' -o -iname '*.zip' \
               -o -iname '*.rar' -o -iname '*.7z' \) 2>/dev/null | grep -q .; then
            office=true
          fi
          if find deposito -type f -iname '*.rar' 2>/dev/null | grep -q .; then archives=true; fi
          # Ficheiros grandes chegam em partes: o conteúdo só se conhece depois de juntar.
          if find deposito -type f -name '*.nexus-parts.yaml' 2>/dev/null | grep -q .; then
            office=true; archives=true
          fi
          # Depósitos grandes chegam num lote (zip): o conteúdo só se conhece ao abrir.
          if find deposito -type f -name '*.nexus-lote.zip*' 2>/dev/null | grep -q .; then
            office=true; archives=true
          fi
          echo "deposit=$deposit" >> "$GITHUB_OUTPUT"
          echo "office=$office" >> "$GITHUB_OUTPUT"
          echo "archives=$archives" >> "$GITHUB_OUTPUT"

      - name: Instalar OCR e Pandoc (só se houver algo no depósito)
        if: steps.tools.outputs.deposit == 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            tesseract-ocr tesseract-ocr-por tesseract-ocr-eng pandoc

      - name: Instalar LibreOffice (só se houver documentos Office no depósito)
        if: steps.tools.outputs.office == 'true'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libreoffice-writer-nogui libreoffice-impress-nogui libreoffice-calc-nogui

      - name: Instalar suporte a .rar
        if: steps.tools.outputs.archives == 'true'
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libarchive-tools

      - uses: astral-sh/setup-uv@v6

      - name: Instalar o motor nexus
        run: |
          uv tool install --python 3.12 \
            "nexus @ git+https://github.com/Knowledge-Nexus/knowledge-nexus.github.io@${{ inputs.app-ref }}"

      - name: Cache de extracção
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/nexus
          key: nexus-extract-${{ github.run_id }}
          restore-keys: nexus-extract-

      - name: Migrar o formato dos ficheiros (se preciso)
        run: nexus migrar

      - name: Publicar o índice dos checkpoints existentes
        # Só vale a pena antes de um depósito longo (a interface vê o progresso mais cedo);
        # não reconstrói se os índices publicados já forem deste commit.
        if: steps.tools.outputs.deposit == 'true'
        env:
          GIT_AUTHOR_NAME: nexus-bot
          GIT_AUTHOR_EMAIL: nexus-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: nexus-bot
          GIT_COMMITTER_EMAIL: nexus-bot@users.noreply.github.com
        run: nexus publicar-indices

      - name: Processar
        id: process
        env:
          # Originais no Cloudflare R2 (storage.backend: r2 no nexus.yaml). Segredos do
          # repositório de dados; o workflow que chama este tem de usar `secrets: inherit`.
          NEXUS_R2_ENDPOINT: ${{ secrets.NEXUS_R2_ENDPOINT }}
          NEXUS_R2_ACCESS_KEY_ID: ${{ secrets.NEXUS_R2_ACCESS_KEY_ID }}
          NEXUS_R2_SECRET_ACCESS_KEY: ${{ secrets.NEXUS_R2_SECRET_ACCESS_KEY }}
          GIT_AUTHOR_NAME: nexus-bot
          GIT_AUTHOR_EMAIL: nexus-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: nexus-bot
          GIT_COMMITTER_EMAIL: nexus-bot@users.noreply.github.com
        run: |
          nexus verificar --rapido || true
          started_at=$(date +%s)
          remaining=true
          reclassify="${{ inputs.reclassify }}"
          batch=0
          since_indices=0
          while true; do
            batch=$((batch + 1))
            args=(processar --max-itens 1 --sem-indices --json)
            if [ "$reclassify" = "true" ]; then args+=(--reclassificar); fi
            set +e
            nexus --verbose "${args[@]}" > "$RUNNER_TEMP/resultado.json"
            status=$?
            set -e
            # Erros de ficheiros individuais (status 2) estão em _erros/, não bloqueiam o lote.
            if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
            BATCH="$batch" python3 - <<'PY'
          import json
          import os
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "resultado.json")))["report"]
          lines = [
              f"## Lote {os.environ['BATCH']}",
              f"- itens processados: **{r['processed_items']}**",
              f"- documentos novos: **{len(r['new_documents'])}**",
              f"- reenvios deduplicados: {len(r['new_sources'])}",
              f"- arrumados: **{len(r['filed'])}**",
              f"- a rever: **{len(r['review'])}**",
              f"- propostas de catálogo: {len(r['proposals'])}",
              f"- erros: {len(r['errors'])}",
          ]
          lines += [f"- item tratado: `{label}`" for label in r["processed_labels"]]
          lines += [f"  - `{label}`: {msg}" for label, msg in r["errors"]]
          lines += [f"- adiado `{label}`: {msg}" for label, msg in r["skipped"]]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          for label in r["processed_labels"]:
              print(f"::notice::Item concluído: {label}")
          PY
            remaining="$(python3 -c 'import json, os; print(str(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "resultado.json")))["report"]["remaining_items"]).lower())')"
            processed="$(python3 -c 'import json, os; print(len(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "resultado.json")))["report"]["processed_labels"]))')"
            since_indices=$((since_indices + processed))
            if [ "$since_indices" -ge 10 ]; then
              nexus publicar-indices
              since_indices=0
            fi
            reclassify=false
            if [ "$remaining" != "true" ]; then break; fi
            elapsed=$(( $(date +%s) - started_at ))
            if [ "$elapsed" -ge 18900 ]; then
              echo "::notice::O limite seguro desta execução foi atingido; a continuação será agendada."
              break
            fi
          done
          # Também depois de uma execução só de reconciliação (ex.: uma correcção): o
          # comando não faz nada se os índices já forem do commit actual.
          nexus publicar-indices
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          if [ "$remaining" = "true" ]; then
            echo "- Ainda há itens por processar; será iniciada outra execução." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar o material marcado como público
        if: success() && steps.process.outputs.remaining != 'true'
        # Só corre se o nexus.yaml tiver publishing.public_repo; só sai o que o dono marcou
        # como "Público" (por cadeira ou por documento). O repositório de dados fica privado.
        env:
          NEXUS_PUBLICO_TOKEN: ${{ secrets.NEXUS_PUBLICO_TOKEN }}
          # Originais no Cloudflare R2 (storage.backend: r2 no nexus.yaml). Segredos do
          # repositório de dados; o workflow que chama este tem de usar `secrets: inherit`.
          NEXUS_R2_ENDPOINT: ${{ secrets.NEXUS_R2_ENDPOINT }}
          NEXUS_R2_ACCESS_KEY_ID: ${{ secrets.NEXUS_R2_ACCESS_KEY_ID }}
          NEXUS_R2_SECRET_ACCESS_KEY: ${{ secrets.NEXUS_R2_SECRET_ACCESS_KEY }}
          GIT_AUTHOR_NAME: nexus-bot
          GIT_AUTHOR_EMAIL: nexus-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: nexus-bot
          GIT_COMMITTER_EMAIL: nexus-bot@users.noreply.github.com
        run: |
          set -euo pipefail
          nexus publicar --json > "$RUNNER_TEMP/publico.json"
          python3 - <<'PY'
          import json
          import os
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "publico.json")))
          if r["configured"]:
              if r["missing_token"]:
                  print("::warning::Há material público por publicar: cria o segredo "
                        "NEXUS_PUBLICO_TOKEN (Settings → Secrets and variables → Actions).")
              state = "publicado" if r["published"] else "; ".join(r["notes"])
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
                  fh.write(f"- material público: {r['documents']} documento(s) → "
                           f"`{r['target']}` ({state})\n")
          PY

      - name: Guarda (os originais nunca são alterados nem apagados)
        # Um force push é uma reescrita deliberada do histórico (ex.: limpar dados de teste),
        # que nem a interface nem o pipeline fazem; nesse caso a guarda não se aplica.
        if: ${{ github.event.forced != true }}
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            git fetch -q --deepen=1 --filter=blob:none origin "$GITHUB_SHA"
            before="$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || true)"
          fi
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            # O histórico superficial basta: só comparamos as árvores do commit anterior.
            git fetch -q --depth=1 --filter=blob:none origin "$before"
            if git diff --name-status --no-renames "$before" HEAD -- originais | grep -v '^A'; then
              echo "::error::Há alterações ou remoções em originais/: proibido."
              exit 1
            fi
          fi

      - name: Guardar a cache de extracção (mesmo se o trabalho falhar ou for cortado)
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/nexus
          key: nexus-extract-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Continuar noutra execução
        if: success() && steps.process.outputs.remaining == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nexus.yml --repo "$GITHUB_REPOSITORY" --ref main --field reclassificar=false